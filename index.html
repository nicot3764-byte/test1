<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Note Taking App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📝 My Notes</h1>
        </header>
        
        <main>
            <section class="note-input-section">
                <h2>Create New Note</h2>
                <form id="noteForm">
                    <div class="form-group">
                        <label for="noteTitle">Title</label>
                        <input type="text" id="noteTitle" placeholder="Enter note title..." required>
                    </div>
                    <div class="form-group">
                        <label for="noteContent">Content</label>
                        <textarea id="noteContent" rows="5" placeholder="Enter note content..." required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary" id="addNoteBtn">Add Note</button>
                    <button type="button" class="btn btn-secondary" id="cancelBtn" style="display: none;">Cancel</button>
                </form>
            </section>
            
            <section class="notes-display-section">
                <div class="notes-header">
                    <h2>My Notes List</h2>
                    <div class="search-container">
                        <input type="text" id="searchInput" placeholder="Search notes...">
                    </div>
                </div>
                <div id="notesList" class="notes-list">
                    <!-- Notes will be dynamically added here -->
                    <p class="no-notes-message">No notes yet. Create your first note above!</p>
                </div>
            </section>
        </main>
        
        <footer>
            <p>&copy; 2025 Note Taking App. All rights reserved.</p>
        </footer>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
